<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>El reloj del abuelo · Breakout del Reloj Real</title>
<meta name="theme-color" content="#2b1a10">
<style>
:root{--wood:#24150c;--wood2:#5C3D1E;--br:#8B6914;--gold:#D4A843;--gold2:#F0C75E;--cream:#FAF7F0;--cream2:#F5E6C0;--ink:#3D2B1F;--mid:#6B4423;--line:#C4A882;--ok:#2E8B57;--bad:#B8452E}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:system-ui,'Segoe UI',Roboto,Arial,sans-serif;color:var(--ink);background:var(--cream);overflow-x:hidden}
button{font:inherit;cursor:pointer;border:0}
.serif{font-family:Georgia,'Times New Roman',serif}
.hidden{display:none!important}

/* ---------- PANTALLA DE INICIO ---------- */
.landing{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px;background:radial-gradient(ellipse at top,#4a2c17,var(--wood) 70%);color:var(--cream2);text-align:center}
.landing h1{font-family:Georgia,serif;font-size:clamp(30px,6vw,56px);color:var(--gold2)}
.landing p{opacity:.85;font-size:18px}
.landing .opts{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.bigopt{background:var(--cream);color:var(--ink);border-radius:20px;padding:22px 28px;min-width:250px;box-shadow:0 8px 24px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;gap:6px;border:3px solid var(--gold)}
.bigopt b{font-size:22px}
.bigopt span{font-size:44px}
.bigopt small{color:var(--mid)}

/* ---------- PDI ---------- */
.pdi{min-height:100vh;height:100vh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 0%,#4a2c17 0%,var(--wood) 75%);color:var(--cream);overflow:hidden}
.pbar{display:flex;align-items:center;gap:6px;padding:8px 14px;background:rgba(0,0,0,.35);border-bottom:2px solid rgba(212,168,67,.35);flex:none}
.pbar .ttl{font-family:Georgia,serif;color:var(--gold2);font-size:18px;margin-right:10px;white-space:nowrap}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.steps button{background:rgba(255,255,255,.08);color:var(--cream2);padding:5px 10px;border-radius:14px;font-size:13px}
.steps button.on{background:var(--gold);color:var(--wood);font-weight:700}
.pbar .sp{flex:1}
.ibtn{background:rgba(255,255,255,.1);color:var(--cream);border-radius:10px;padding:6px 10px;font-size:16px}
.pmain{flex:1;display:flex;align-items:center;justify-content:center;padding:2vh 3vw;gap:3vw;min-height:0}
.pbtn{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--wood);font-weight:800;font-size:clamp(18px,2.2vw,30px);padding:.6em 1.4em;border-radius:999px;box-shadow:0 6px 0 #8a6a1d,0 10px 24px rgba(0,0,0,.4)}
.pbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #8a6a1d}
.pbtn.sec{background:rgba(255,255,255,.12);color:var(--cream);box-shadow:none;font-weight:600}
.portada{display:flex;align-items:center;gap:4vw}
.portada .txt{max-width:46vw;display:flex;flex-direction:column;gap:2.4vh}
.portada h1{font-family:Georgia,serif;font-size:clamp(36px,6vw,92px);line-height:1;color:var(--gold2);text-shadow:0 4px 0 rgba(0,0,0,.4)}
.portada h2{font-size:clamp(16px,1.9vw,28px);color:var(--cream2);font-weight:500}
.qrbox{display:flex;align-items:center;gap:16px;background:rgba(0,0,0,.3);border:2px dashed rgba(212,168,67,.5);border-radius:16px;padding:12px 16px}
.qrbox .qr{background:#fff;border-radius:10px;padding:6px;width:clamp(110px,12vw,190px);height:clamp(110px,12vw,190px)}
.qrbox .qr svg{width:100%;height:100%;display:block}
.qrbox b{color:var(--gold2);font-size:clamp(15px,1.5vw,22px)}
.qrbox small{display:block;opacity:.8;word-break:break-all;font-size:clamp(11px,1vw,15px);margin-top:4px}
.cuckoo{height:min(72vh,46vw);flex:none}
.historia{max-width:1100px;display:flex;flex-direction:column;gap:2.2vh}
.historia p{font-size:clamp(18px,2.35vw,36px);line-height:1.35;opacity:0;transform:translateY(12px);animation:aparece .7s forwards}
.historia p b{color:var(--gold2)}
@keyframes aparece{to{opacity:1;transform:none}}
.historia .row{display:flex;gap:14px;margin-top:1.5vh}
.normas{display:grid;grid-template-columns:1.1fr 1fr;gap:2.5vw;width:100%;max-width:1500px}
.mcards{display:flex;flex-direction:column;gap:1.4vh}
.mcard{display:flex;align-items:center;gap:14px;background:var(--cream);color:var(--ink);border-radius:14px;padding:1.2vh 16px;border-left:12px solid}
.mcard .ic{font-size:clamp(28px,3.4vw,52px)}
.mcard b{font-size:clamp(17px,1.8vw,28px);display:block}
.mcard small{font-size:clamp(13px,1.2vw,19px);color:var(--mid)}
.reglas{display:flex;flex-direction:column;gap:1vh;font-size:clamp(14px,1.45vw,22px)}
.reglas div{background:rgba(255,255,255,.07);border-radius:10px;padding:.7vh 12px}
.rot{width:100%;border-collapse:separate;border-spacing:4px;font-size:clamp(13px,1.35vw,21px)}
.rot th{color:var(--gold2);font-weight:700;padding:2px 6px}
.rot td{background:rgba(255,255,255,.08);border-radius:8px;padding:4px 8px;text-align:center;white-space:nowrap}
.rot td.tm{text-align:left;font-weight:700}
.rot td.now{outline:3px solid var(--gold2)}
.tchip{display:inline-flex;align-items:center;justify-content:center;width:1.6em;height:1.6em;border-radius:50%;color:#fff;margin-right:6px;font-size:1.05em}
.mchip{display:inline-block;color:#fff;border-radius:7px;padding:1px 8px;font-weight:800}
.ronda{display:grid;grid-template-columns:auto 1fr;gap:4vw;align-items:center;width:100%;max-width:1600px}
.ring{position:relative;width:min(62vh,40vw);height:min(62vh,40vw)}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tm{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .tm b{font-family:Georgia,serif;font-size:min(15vh,9.5vw);color:var(--gold2);font-variant-numeric:tabular-nums;line-height:1}
.ring .tm span{font-size:min(3.2vh,2vw);color:var(--cream2);text-transform:uppercase;letter-spacing:3px}
.ring.alerta .tm b{color:#ff7b5c;animation:latido 1s infinite}
@keyframes latido{50%{transform:scale(1.06)}}
.rside{display:flex;flex-direction:column;gap:2vh}
.rside h2{font-family:Georgia,serif;color:var(--gold2);font-size:clamp(26px,3.4vw,54px)}
.ctrl{display:flex;gap:10px;flex-wrap:wrap}
.mapa{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4vw}
.mcol{background:rgba(255,255,255,.07);border-radius:14px;padding:1.2vh 1vw;display:flex;flex-direction:column;gap:1vh;border-top:8px solid}
.mcol h3{font-size:clamp(15px,1.6vw,25px);display:flex;align-items:center;gap:8px}
.mcol .eq{background:var(--cream);color:var(--ink);border-radius:10px;padding:.8vh 10px;font-weight:700;font-size:clamp(14px,1.5vw,23px);display:flex;align-items:center}
.mcol .eq em{margin-left:auto;font-style:normal;color:var(--mid);font-weight:600}
.overlay{position:fixed;inset:0;background:rgba(20,10,4,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;z-index:20;text-align:center;padding:3vh 3vw}
.overlay h1{font-family:Georgia,serif;font-size:clamp(40px,8vw,120px);color:var(--gold2)}
.overlay h2{font-size:clamp(18px,2.4vw,36px);color:var(--cream2);font-weight:500}
.final{display:grid;grid-template-columns:auto 1fr;gap:4vw;align-items:center;width:100%;max-width:1600px}
.gears{display:grid;grid-template-columns:repeat(3,1fr);gap:2vw}
.gbtn{background:rgba(255,255,255,.07);border:3px dashed rgba(255,255,255,.25);border-radius:20px;padding:1.6vh 1vw;color:var(--cream);display:flex;flex-direction:column;align-items:center;gap:.6vh}
.gbtn svg{width:min(14vh,9vw);height:min(14vh,9vw);opacity:.35;transition:opacity .3s}
.gbtn b{font-size:clamp(15px,1.7vw,26px)}
.gbtn.on{border-style:solid;background:rgba(46,139,87,.25);border-color:#5fd18f}
.gbtn.on svg{opacity:1;animation:gira 3s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.cuenta{font-size:clamp(18px,2.2vw,32px);color:var(--cream2)}
.cuenta b{color:var(--gold2);font-size:1.5em}
.abierto{display:flex;align-items:center;gap:5vw}
.abierto .txt{display:flex;flex-direction:column;gap:2vh;max-width:48vw}
.abierto h1{font-family:Georgia,serif;font-size:clamp(34px,5.4vw,84px);color:var(--gold2);line-height:1.05}
.dig{font-family:'Courier New',monospace;font-weight:700;background:#111;color:#ff5a3c;border-radius:12px;padding:.1em .4em;letter-spacing:4px;display:inline-block;box-shadow:inset 0 0 18px rgba(255,90,60,.35)}
.pasos{display:flex;flex-direction:column;gap:1.2vh;font-size:clamp(17px,2vw,30px)}
.pasos div{background:rgba(255,255,255,.08);border-radius:12px;padding:.8vh 16px;opacity:0;animation:aparece .6s forwards}
.cierre{max-width:1200px;display:flex;flex-direction:column;gap:2.4vh}
.cierre h1{font-family:Georgia,serif;color:var(--gold2);font-size:clamp(30px,4.4vw,66px)}
.cierre .q{font-size:clamp(18px,2.4vw,36px);background:rgba(255,255,255,.08);border-radius:14px;padding:1.2vh 20px;display:flex;gap:16px;align-items:center}
.cierre .q span{font-size:1.4em}
.confeti{position:fixed;top:-40px;font-size:30px;z-index:30;pointer-events:none;animation:cae linear forwards}
@keyframes cae{to{transform:translateY(110vh) rotate(720deg)}}
.cfg{position:fixed;right:14px;top:56px;background:var(--cream);color:var(--ink);border-radius:14px;padding:14px 16px;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:10px;min-width:260px}
.cfg label{display:flex;justify-content:space-between;gap:10px;align-items:center}
.cfg input{width:64px;font-size:16px;padding:4px;border:1.5px solid var(--line);border-radius:6px}
.cfg button{background:var(--wood2);color:var(--cream);border-radius:8px;padding:6px 10px}

/* ---------- RELOJ DE CUCO (dibujo) ---------- */
.pend{transform-origin:200px 352px;animation:pendulo 2s ease-in-out infinite alternate}
@keyframes pendulo{from{transform:rotate(9deg)}to{transform:rotate(-9deg)}}
.puerta{transform-origin:178px 120px;transition:transform .8s}
.cuckoo.abre .puerta{transform:scaleX(-.15)}
.pajaro{transform:translateY(26px);transition:transform .6s .5s}
.cuckoo.abre .pajaro{transform:translateY(0)}
.cuckoo.abre .pajaro{animation:canta .5s 1.3s 6 alternate}
@keyframes canta{to{transform:translateY(-6px) rotate(-6deg)}}

/* ---------- TABLET DE EQUIPO ---------- */
.tab{min-height:100vh;background:var(--cream);display:flex;flex-direction:column}
.thead{background:linear-gradient(135deg,var(--br),var(--wood2));color:var(--cream);padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
.thead .pz{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;border:3px solid var(--gold);flex:none}
.thead h1{font-family:Georgia,serif;font-size:20px;color:var(--cream2);line-height:1.1}
.thead small{display:block;color:var(--gold2);font-size:12px;letter-spacing:.6px;text-transform:uppercase}
.thead .sp{flex:1}
.thead button{background:rgba(255,255,255,.15);color:var(--cream);border-radius:10px;padding:8px 12px;font-size:16px}
.tbody{flex:1;width:100%;max-width:780px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.elige{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.ebtn{background:#fff;border-radius:18px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;border:4px solid;box-shadow:0 4px 12px rgba(92,61,30,.15)}
.ebtn span{font-size:52px;line-height:1}
.ebtn b{font-size:20px}
.ruta{display:flex;gap:8px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px;align-items:center;flex-wrap:wrap}
.ruta .r{display:flex;align-items:center;gap:6px;font-size:15px}
.ruta .r b{color:#fff;border-radius:8px;padding:2px 8px}
.ruta .ar{color:var(--line);font-size:18px}
.ruta small{width:100%;color:var(--mid);font-size:13px}
.gcard{background:#fff;border-radius:16px;border-left:12px solid;box-shadow:0 3px 10px rgba(92,61,30,.13);padding:12px 14px;display:flex;align-items:center;gap:14px;text-align:left;width:100%;color:var(--ink)}
.gcard .gi{width:64px;height:64px;flex:none}
.gcard .gi svg{width:100%;height:100%}
.gcard.ok .gi svg{animation:gira 6s linear infinite}
.gcard b{font-size:19px;display:block}
.gcard small{color:var(--mid);font-size:14px}
.gcard .nota{margin-top:4px;background:var(--cream2);border-radius:8px;padding:6px 10px;font-size:15px;font-style:italic;color:var(--wood2)}
.gcard .go{margin-left:auto;font-size:26px;color:var(--mid)}
.gcard.lock{opacity:.55}
.extra{background:var(--wood2);color:var(--cream);border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:12px;font-size:17px;text-align:left}
.extra span{font-size:30px}
.panel{background:#fff;border-radius:16px;padding:16px;box-shadow:0 3px 10px rgba(92,61,30,.12);display:flex;flex-direction:column;gap:12px}
.panel h2{font-family:Georgia,serif;font-size:24px;color:var(--wood2);display:flex;align-items:center;gap:10px}
.panel .ins{font-size:17px;line-height:1.35}
.panel .uk{font-size:13px;color:var(--mid)}
.word{font-family:'Courier New',monospace;font-weight:700;font-size:34px;letter-spacing:10px;text-transform:uppercase;text-align:center;border:3px solid var(--line);border-radius:12px;padding:10px;width:100%;background:var(--cream);color:var(--ink)}
.word:focus{outline:none;border-color:var(--gold)}
.huecos{text-align:center;color:var(--mid);font-size:14px}
.tiempos{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center;font-size:20px}
.tiempos .who{font-weight:800}
.tiempos .in{display:flex;align-items:center;gap:8px}
.tiempos input{width:84px;font-size:28px;font-weight:700;text-align:center;border:3px solid var(--line);border-radius:10px;padding:6px;background:var(--cream)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.tbtn{flex:1;min-width:140px;background:var(--ok);color:#fff;font-weight:800;font-size:20px;border-radius:14px;padding:14px;box-shadow:0 5px 0 #1d6340}
.tbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #1d6340}
.tbtn.pista{background:var(--gold);color:var(--wood);box-shadow:0 5px 0 #9c7a26}
.tbtn.vol{background:#ddd2bd;color:var(--ink);box-shadow:0 5px 0 #b9a888;flex:0 0 auto;min-width:0}
.msg{border-radius:12px;padding:10px 14px;font-size:17px;font-weight:600}
.msg.mal{background:#fbe1da;color:#8c2d18}
.msg.pis{background:var(--cream2);color:var(--wood2);font-weight:500}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.exito{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;color:#fff;background:radial-gradient(circle,#3aa86b,#1b5e3a)}
.exito svg.g{width:150px;height:150px;animation:gira 4s linear infinite}
.exito h1{font-family:Georgia,serif;font-size:clamp(30px,7vw,52px)}
.exito .nt{background:rgba(255,255,255,.95);color:var(--wood2);border-radius:14px;padding:14px 18px;font-size:21px;font-style:italic;max-width:560px}
.exito small{font-size:16px;opacity:.95}
.exito button{background:#fff;color:#1b5e3a;font-weight:800;font-size:19px;border-radius:999px;padding:12px 26px}
.notas{display:flex;flex-direction:column;gap:6px}
.notas div{background:var(--cream2);border-radius:10px;padding:7px 12px;font-size:16px;font-style:italic;color:var(--wood2)}
.relwrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.relwrap svg{width:min(78vw,340px);height:min(78vw,340px);touch-action:none;user-select:none}
.hbtns{display:flex;gap:10px}
.hbtns button{background:var(--wood2);color:var(--cream);border-radius:10px;padding:8px 14px;font-size:17px;font-weight:700}
.mt{display:flex;gap:10px;width:100%}
.mt button{flex:1;border-radius:12px;padding:12px;font-size:19px;font-weight:700;background:#fff;border:3px solid var(--line);color:var(--ink)}
.mt button.on{background:var(--wood2);color:#fff;border-color:var(--wood2)}
.maestro{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.maestro .box{background:#fff;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;max-width:360px;width:100%}
.maestro input{font-size:24px;text-align:center;border:2px solid var(--line);border-radius:10px;padding:8px}
.seg{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.seg .obj{display:flex;gap:10px}
.seg .obj button{background:#fff;border:3px solid var(--line);border-radius:12px;padding:10px 16px;font-size:20px;font-weight:800;color:var(--ink)}
.seg .obj button.on{border-color:var(--wood2);background:var(--wood2);color:#fff}
.seg .pulsa{width:min(70vw,300px);height:min(70vw,300px);border-radius:50%;background:radial-gradient(circle,var(--gold2),var(--br));color:var(--wood);font-size:30px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(92,61,30,.35)}
.seg .pulsa.run{background:radial-gradient(circle,#3b2416,#120a05);color:var(--gold2);animation:respira 1.6s ease-in-out infinite}
@keyframes respira{50%{transform:scale(.96)}}
.seg .res{font-size:22px}
.seg .res b{font-size:40px;color:var(--wood2);display:block}
.estrellas{font-size:26px;letter-spacing:2px}
.hist{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.hist span{background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:3px 8px;font-size:14px}
.ccbtn{width:100%;background:#24150c;color:var(--gold2);border-radius:14px;padding:14px;font-size:19px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px}
.cc{position:fixed;inset:0;display:flex;flex-direction:column;background:#120a05;z-index:40;user-select:none;-webkit-user-select:none}
.cc-side{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--cream2);background:#3b2416;font-size:22px;font-weight:700;touch-action:manipulation;transition:background .15s}
.cc-side b{font-family:'Courier New',monospace;font-size:min(24vw,16vh);letter-spacing:3px;line-height:1;font-variant-numeric:tabular-nums}
.cc-side small{font-size:17px;font-weight:600;opacity:.9}
.cc-side.on{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--wood)}
.cc-side.flag{background:var(--bad);color:#fff}
.cc-side.top{transform:rotate(180deg)}
.cc-mid{display:flex;gap:8px;justify-content:center;align-items:center;padding:8px;background:var(--wood);flex-wrap:wrap}
.cc-mid button{background:rgba(255,255,255,.12);color:var(--cream2);border-radius:10px;padding:10px 14px;font-size:16px;font-weight:700}
.cc-mid span{color:var(--cream2);opacity:.8;font-size:13px;width:100%;text-align:center}
</style>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

 S:null,

 vPortada(){const u=equipoURL();return `<div class="portada">${relojCuco(10*60+10)}<div class="txt"><h2>JaqueMáTICas · SdA 6 · La carrera del Reloj Real</h2><h1>El reloj del abuelo</h1><h2>Breakout · 3 mesas · 1 cuco dormido</h2><div class="qrbox"><div class="qr">${qrSVG(u)}</div><div><b>📱 Tablets de equipo</b><br>Escanead el código y elegid vuestro equipo<small>${u}</small></div></div><div><button class="pbtn" data-act="historia">Empezar ▶</button></div></div></div>`},

const TAB={
 S:null,

  const bk=$('#back');if(bk)bk.onclick=()=>this.go('panel');const ma=$('#mae');if(ma)ma.onclick=()=>this.maestro();
  app.querySelectorAll('[data-act]').forEach(e=>e.onclick=()=>this.act(e.dataset.act,e));
  if(v==='F')this.bindReloj();
  const w=$('.word');if(w){w.addEventListener('keydown',e=>{if(e.key==='Enter')this.act('check')})}
 },
 vElige(){return `<div class="panel"><h2>¿Qué equipo sois?</h2><div class="uk">Ваша команда?</div><div class="elige">${TEAMS.map((T,t)=>`<button class="ebtn" style="border-color:${T.c}" data-act="team" data-t="${t}"><span style="color:${T.c}">${T.p}</span><b>${T.n}</b><small>Mesa ${mesaTxt(t,1)}</small></button>`).join('')}</div></div>`},
 vPanel(){const S=this.S,t=S.team;const tot=['A','B','C'].filter(m=>S.ok[m]).length;
  const ruta=`<div class="ruta">${[1,2,3].map(r=>`<div class="r">R${r} <b style="background:${MESAS[mesaDe(t,r)].c}">${MESAS[mesaDe(t,r)].i} ${mesaTxt(t,r)}</b></div>${r<3?'<span class="ar">➜</span>':''}`).join('')}<small>Vuestra ruta. Cuando cante el cuco, pasad a la mesa siguiente.</small></div>`;
  const cards=['A','B','C'].map(m=>{const M=MESAS[m];const ok=S.ok[m];return `<button class="gcard ${ok?'ok':''}" style="border-color:${M.c}" data-act="${ok?'nada':'abre'}" data-m="${m}"><div class="gi">${gearSVG(ok?M.c:'#c9bba3',ok?m:'🔒')}</div><div style="flex:1"><b>${M.i} ${M.n}</b><small>${ok?'¡Engranaje '+m+' conseguido!':M.t}</small>${ok?`<div class="nota">${NUM[m]} ${NOTAS[m]}</div>`:''}</div>${ok?'':'<span class="go">›</span>'}</button>`}).join('');
  const fin=tot===3?`<button class="gcard ${S.ok.F?'ok':''}" style="border-color:var(--gold)" data-act="${S.ok.F?'verfinal':'final'}"><div class="gi">${gearSVG('#D4A843','♚')}</div><div style="flex:1"><b>🐦 La hora del cuco</b><small>${S.ok.F?'¡Engranaje maestro encajado!':'Abrid el sobre TOP SECRET y poned la hora en el reloj'}</small></div><span class="go">›</span></button>`:`<div class="gcard lock" style="border-color:var(--line)"><div class="gi">${gearSVG('#c9bba3','🔒')}</div><div><b>🐦 La hora del cuco</b><small>Necesitáis los 3 engranajes (${tot} de 3)</small></div></div>`;
  return ruta+cards+fin+`<button class="extra" data-act="seg"><span>⏱️</span><div><b>Reto del segundero</b><br><small>¿Habéis acabado antes? ¿Quién cuenta los segundos sin mirar? ${'⭐'.repeat(Math.min(S.stars,10))}</small></div></button>`},
 vPalabra(m){const M=MESAS[m],S=this.S;const n=m==='A'?6:9;
  return `<div class="panel" style="border-top:10px solid ${M.c}"><h2>${M.i} ${M.n}</h2>
  <div class="ins">${m==='A'?'Poned cada hora en el reloj. Mirad la letra que señala la <b>aguja larga</b>. Escribid la palabra que forman las letras.':'Colgad las tarjetas de <b>lo que dura menos</b> a <b>lo que dura más</b>. Dadles la vuelta y escribid la palabra que aparece.'}</div>
  <div class="uk">Таємне слово · ${n} літер</div>
  <input class="word" id="w" maxlength="${n}" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="${'_'.repeat(n)}">
  <div class="huecos">${n} letras</div>
  <div id="msg"></div>
  <div class="btns"><button class="tbtn" data-act="check" data-m="${m}">✓ Comprobar <small>· Перевірити</small></button><button class="tbtn pista" data-act="pista" data-m="${m}">💡 Pista <small>· Підказка</small></button></div></div>`},
 vPartida(){const M=MESAS.B;this.bv=this.bv||{bm:'',bs:'',nm:'',ns:''};return `<div class="panel" style="border-top:10px solid ${M.c}"><h2>${M.i} ${M.n}</h2>
  <div class="ins">Jugad la partida del abuelo con el reloj de ajedrez. Después escribid <b>cuánto ha pensado en total</b> cada jugador.</div>
  <button class="ccbtn" data-act="reloj">⏱️ ¿No hay reloj de ajedrez? Usad la tablet</button>
  <div class="tiempos"><div class="who">♔ Blancas<div class="uk">Білі</div></div><div class="in"><input id="bm" inputmode="numeric" maxlength="2" value="${this.bv.bm}"> min <input id="bs" inputmode="numeric" maxlength="3" value="${this.bv.bs}"> s</div>
  <div class="who">♚ Negras<div class="uk">Чорні</div></div><div class="in"><input id="nm" inputmode="numeric" maxlength="2" value="${this.bv.nm}"> min <input id="ns" inputmode="numeric" maxlength="3" value="${this.bv.ns}"> s</div></div>
  <div id="msg"></div>
  <div class="btns"><button class="tbtn" data-act="check" data-m="B">✓ Comprobar <small>· Перевірити</small></button><button class="tbtn pista" data-act="pista" data-m="B">💡 Pista <small>· Підказка</small></button></div></div>`},
 vFinal(){const S=this.S;return `<div class="panel" style="border-top:10px solid var(--gold)"><h2>🐦 La hora del cuco</h2>
  <div class="notas">${['A','B','C'].map(m=>`<div>${NUM[m]} ${NOTAS[m]}</div>`).join('')}</div>
  <div class="ins">Haced la cuenta en la hoja <b>TOP SECRET</b>. Después <b>arrastrad la aguja larga</b> hasta la hora en que despierta el cuco.</div>
  <div class="relwrap"><svg id="rel" viewBox="-110 -110 220 220">${caraReloj(100)}${agujas(S.clock,100,'f')}</svg>
  <div class="hbtns"><button data-act="h-">−1 hora</button><button data-act="h0">12 en punto</button><button data-act="h+">+1 hora</button></div></div>
  <div class="mt"><button class="${S.tarde===false?'on':''}" data-act="man">☀️ Mañana<br><small>вранці</small></button><button class="${S.tarde===true?'on':''}" data-act="tar">🌇 Tarde<br><small>вдень</small></button></div>
  <div id="msg"></div>
  <div class="btns"><button class="tbtn" data-act="checkF">🐦 ¡Que cante el cuco!</button><button class="tbtn pista" data-act="pista" data-m="F">💡 Pista</button></div></div>`},
 bindReloj(){const svg=$('#rel');if(!svg)return;const S=this.S;let drag=false;
  const upd=()=>{const tot=((S.clock%720)+720)%720;svg.querySelector('#fhh').setAttribute('transform',`rotate(${(tot/60)*30})`);svg.querySelector('#fmm').setAttribute('transform',`rotate(${(tot%60)*6})`)};
  const ang=e=>{const r=svg.getBoundingClientRect();const x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2);let a=Math.atan2(x,-y)*180/Math.PI;if(a<0)a+=360;return a};
  const mover=e=>{const a=ang(e);let m=Math.round(a/30)%12*5;const tot=((S.clock%720)+720)%720;const pm=tot%60;let h=Math.floor(tot/60);if(pm>=45&&m<=10)h++;else if(pm<=10&&m>=45)h--;S.clock=(((h*60+m)%720)+720)%720;upd()};
  svg.addEventListener('pointerdown',e=>{drag=true;svg.setPointerCapture(e.pointerId);mover(e)});
  svg.addEventListener('pointermove',e=>{if(drag)mover(e)});
  const fin=()=>{if(drag){drag=false;this.save();tic(true)}};svg.addEventListener('pointerup',fin);svg.addEventListener('pointercancel',fin);upd()},
 vSeg(){const S=this.S;const obj=this.obj||15;return `<div class="panel"><h2>⏱️ Reto del segundero</h2><div class="ins">Elegid un tiempo. Pulsad el botón, contad <b>en silencio</b> y volved a pulsar cuando creáis que ha pasado ese tiempo. Si os acercáis a menos de 1 segundo, ganáis una estrella.</div>
  <div class="seg"><div class="obj">${[10,15,20,30].map(s=>`<button class="${obj===s?'on':''}" data-act="obj" data-s="${s}">${s} s</button>`).join('')}</div>
  <button class="pulsa ${this.t0?'run':''}" data-act="pulsa">${this.t0?'¡YA!':'Empezar'}</button>
  <div class="res" id="res">${this.res||''}</div><div class="estrellas">${'⭐'.repeat(S.stars)||'☆'}</div><div class="hist">${S.hist.slice(-8).map(h=>`<span>${h}</span>`).join('')}</div></div></div>`},
 act(a,e){const S=this.S;
  if(a==='team'){S.team=+e.dataset.t;this.save();exito();this.go('panel')}
  if(a==='abre')this.go(e.dataset.m);
  if(a==='final')this.go('F');
  if(a==='verfinal')this.exitoFinal();
  if(a==='seg'){this.t0=null;this.res='';this.go('seg')}
  if(a==='pista')this.pista(e.dataset.m);
  if(a==='check')this.check(e.dataset.m);
  if(a==='h+'){S.clock=(S.clock+60)%720;this.save();this.render()}
  if(a==='h-'){S.clock=(S.clock+660)%720;this.save();this.render()}
  if(a==='h0'){S.clock=0;this.save();this.render()}
  if(a==='man'){S.tarde=false;this.save();this.render()}
  if(a==='tar'){S.tarde=true;this.save();this.render()}
  if(a==='checkF')this.checkF();
  if(a==='obj'){this.obj=+e.dataset.s;this.res='';this.render()}
  if(a==='pulsa')this.pulsa();
  if(a==='reloj'){this.bv={};['bm','bs','nm','ns'].forEach(i=>{const x=$('#'+i);this.bv[i]=x?x.value.replace(/[^0-9]/g,''):''});this.go('R')}
  if(a==='cc')this.ccTap(e.dataset.s);
  if(a==='ccp'){const C=this.cc;if(C.paused){C.paused=false;C.last=performance.now()}else if(C.run){C.t[C.run]-=(performance.now()-C.last)/1000;C.paused=true}this.render()}
  if(a==='ccr'){if(this.ccConf)this.ccReset();else this.ccConf=true;this.render()}
  if(a==='ccv'){this.ccConf=false;this.go('B')}
 },
 msg(txt,cls='mal'){const m=$('#msg');if(!m)return;m.innerHTML=`<div class="msg ${cls}">${txt}</div>`;if(cls==='mal'){const p=$('.panel');p.classList.remove('shake');void p.offsetWidth;p.classList.add('shake');fallo()}},
 pista(m){const S=this.S;if(!S.hint[m]){S.hint[m]=1;this.save()}this.msg('💡 '+PISTAS[m],'pis')},
 check(m){const S=this.S;S.tries[m]++;this.save();
  if(m==='A'||m==='C'){const w=norm($('#w').value);if(!w){this.msg('Escribid la palabra primero.');return}
   if(hsh(w)===HASH[m])return this.ganar(m);
   const n=m==='A'?6:9;if(w.length<n)return this.msg(`La palabra tiene ${n} letras y habéis escrito ${w.length}.`);
   return this.msg(m==='A'?'El reloj no se abre. Revisad la aguja larga de cada tarjeta: ¿a qué número apunta?':'El tendedero no está en orden. Pasad las tarjetas a la misma unidad y comparad otra vez.')}
  if(m==='B'){const v=id=>{const x=$('#'+id).value.trim();return x===''?NaN:+x};const bm=v('bm'),bs=v('bs'),nm=v('nm'),ns=v('ns');
   if([bm,bs,nm,ns].some(isNaN))return this.msg('Rellenad los minutos y los segundos de los dos jugadores (si no hay minutos, poned 0).');
   const tb=bm*60+bs,tn=nm*60+ns;
   if(tb===100&&tn===85){if(bs>=60||ns>=60)return this.msg('¡Los segundos están bien sumados! Pero 60 segundos hacen 1 minuto. Pasadlo a minutos y segundos.');return this.ganar('B')}
   if(tb===85&&tn===100)return this.msg('¡Casi! Habéis cambiado las blancas por las negras.');
   if(tb===100||tn===85)return this.msg(`Un jugador está bien y el otro no. Revisad ${tb===100?'las negras':'las blancas'}.`);
   return this.msg('No cuadra. Volved a sumar lo que piensa cada color en la partitura.')}
 },
 ganar(m){const S=this.S;S.ok[m]=1;const mm=$('#msg');if(mm)mm.innerHTML='';this.save();exito();setTimeout(()=>cuco(1),450);const M=MESAS[m];
  const d=document.createElement('div');d.className='exito';d.innerHTML=`${gearSVG(M.c,m,'g')}<h1>¡Engranaje ${m}!</h1><div class="nt">${NUM[m]} ${NOTAS[m]}</div><small>Si en la mesa hay un cofre de engranajes, coged un engranaje ${m}.<br>Cuando cante el cuco, id a la mesa siguiente.</small><button>Volver al cuaderno</button>`;document.body.appendChild(d);d.querySelector('button').onclick=()=>{d.remove();this.go('panel')}},
 checkF(){const S=this.S;S.tries.F++;this.save();const tot=((S.clock%720)+720)%720;
  if(S.tarde===null)return this.msg('Elegid si es por la mañana o por la tarde.');
  if(tot===155){if(!S.tarde)return this.msg('¡Las agujas están perfectas! Pero… ¿es por la mañana o por la tarde? Leed la nota ③.');S.ok.F=1;this.save();return this.exitoFinal(true)}
  if(tot===10)return this.msg('Esa es la hora de salida, la del reloj de la clase. Ahora sumad el tiempo de la nota ②.');
  if(tot===130)return this.msg('¡Vais bien! Ya habéis sumado las 2 horas. Os faltan los 25 minutos.');
  if(tot===215)return this.msg('Cuidado: «menos veinticinco» es ANTES de la hora en punto. Revisad la aguja corta.');
  if(tot===145)return this.msg('Habéis sumado 2 horas y 15 minutos. Revisad los minutos de la nota ②.');
  if(Math.floor(tot/60)===2)return this.msg('La hora va bien. Revisad los minutos: ¿cuánto es 10 + 25?');
  return this.msg('El cuco no canta. Repasad la hoja TOP SECRET paso a paso.')},
 exitoFinal(nuevo){const T=TEAMS[this.S.team];if(nuevo){exito();setTimeout(()=>cuco(2),500);confeti(40)}const d=document.createElement('div');d.className='exito';d.style.background=`radial-gradient(circle,#3aa86b,#1b5e3a)`;d.innerHTML=`<div style="font-size:70px;width:110px;height:110px;border-radius:50%;background:${T.c};display:flex;align-items:center;justify-content:center;border:5px solid #fff">${T.p}</div><h1>¡Engranaje maestro!</h1><div class="nt">El cuco despierta a las tres menos veinticinco de la tarde<br><span class="dig" style="font-size:40px;margin-top:10px;font-style:normal">14:35</span></div><small style="font-size:22px;font-weight:800">¡Levantad la tablet para que el maestro la vea!</small><button>Volver al cuaderno</button>`;document.body.appendChild(d);d.querySelector('button').onclick=()=>{d.remove();this.go('panel')}},
 pulsa(){const S=this.S;const obj=this.obj||15;
  if(!this.t0){this.t0=performance.now();this.res='';this.render();return}
  const dt=(performance.now()-this.t0)/1000;this.t0=null;const err=dt-obj;const ok=Math.abs(err)<=1;
  if(ok){S.stars++;exito()}else tic();
  const f=x=>x.toFixed(1).replace('.',',');
  this.res=`<b>${f(dt)} s</b>${ok?'¡Estrella! ⭐ ':''}${Math.abs(err)<.05?'¡Exacto!':(err>0?'Os habéis pasado '+f(err)+' s':'Os han faltado '+f(-err)+' s')}`;
  S.hist.push(`${obj}s → ${f(dt)}`);this.save();this.render()},
 maestro(){const d=document.createElement('div');d.className='maestro';d.innerHTML=`<div class="box"><b>Solo para el maestro</b><input id="mc" type="password" inputmode="numeric" placeholder="Código"><div class="btns"><button class="tbtn vol" id="mx">Cerrar</button><button class="tbtn" id="mo">Entrar</button></div><div id="mopc"></div></div>`;document.body.appendChild(d);
  d.querySelector('#mx').onclick=()=>d.remove();
  d.querySelector('#mo').onclick=()=>{if($('#mc').value!=='1435'){$('#mc').value='';return}const S=this.S;const o=$('#mopc');o.innerHTML=`<div style="font-size:14px;color:var(--mid)">Pistas usadas: ${['A','B','C','F'].filter(m=>S.hint[m]).join(', ')||'ninguna'} · Intentos: A ${S.tries.A}, B ${S.tries.B}, C ${S.tries.C}, final ${S.tries.F}</div><button class="tbtn vol" id="m1">Cambiar de equipo</button><button class="tbtn" style="background:#B8452E;box-shadow:none" id="m2">Borrar todo el progreso</button>`;
   o.querySelector('#m1').onclick=()=>{S.team=null;this.save();d.remove();this.go('elige')};
   o.querySelector('#m2').onclick=()=>{this.S={team:null,ok:{A:0,B:0,C:0,F:0},hint:{A:0,B:0,C:0,F:0},tries:{A:0,B:0,C:0,F:0},stars:0,hist:[],clock:0,tarde:null};this.save();d.remove();this.go('elige')}}}
};
route();
</script>
<script>/*pwa-sw*/if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){})});}</script>
